# `bun fmt` (Prettier-compatible). See https://bun.com/docs/runtime/format
# 4 spaces, single quotes, semicolons, no trailing commas, arrow parens only when needed.
[fmt]
printWidth = 100
tabWidth = 4
singleQuote = true
semi = true
trailingComma = "none"
arrowParens = "avoid"
sortImports = true
sortPackageJson = true

